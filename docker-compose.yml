services:
  db:
    image: postgres:16-alpine
    container_name: opspilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [opspilot]

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [opspilot]

  backend:
    build: ./backend
    container_name: opspilot-backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [opspilot]

  celery:
    build: ./backend
    container_name: opspilot-celery
    command: celery -A config worker -l info
    env_file: .env
    volumes: ["./backend:/app"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [opspilot]

  frontend:
    build: ./frontend
    container_name: opspilot-frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]
    networks: [opspilot]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: opspilot-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [opspilot]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  prometheus_data:

networks:
  opspilot:
    driver: bridge
